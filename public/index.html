<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Desesperanza - Catálogo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card img {
    height: 160px;
    object-fit: cover;
}
</style>

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand h1">🍞 Desesperanza</span>
    <a class="btn btn-warning" href="gestionar.html">Gestionar Panes</a>
</nav>

<div class="container mt-4">
    <h2 class="mb-3">Catálogo de Panes</h2>
    <div class="row" id="catalogo"></div>
</div>

<script>
async function cargarCatalogo() {
    const res = await fetch("/panes");
    const panes = await res.json();
    const cont = document.getElementById("catalogo");
    cont.innerHTML = "";

    panes.forEach(pan => {
        const img = pan.imagen
            ? `<img src="data:image/jpeg;base64,${pan.imagen}" class="card-img-top">`
            : `<img src="https://via.placeholder.com/150" class="card-img-top">`;

        cont.innerHTML += `
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                ${img}
                <div class="card-body">
                    <h5 class="card-title">${pan.nombre}</h5>
                    <p class="card-text">${pan.descripcion}</p>
                    <p class="fw-bold">$${pan.precio}</p>
                    <span class="badge bg-primary">Cantidad: ${pan.cantidad}</span>
                </div>
            </div>
        </div>`;
    });
}

cargarCatalogo();
</script>

</body>
</html>
