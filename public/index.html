<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desesperanza - Panes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="#">Desesperanza</a>

            <div class="d-flex align-items-center gap-3">

                <!-- ✅ Nombre del usuario -->
                <div id="user-info" class="fw-semibold text-primary"></div>

                <!-- ✅ Botón para abrir Login Modal -->
                <button id="login-btn" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#loginModal">
                    Iniciar Sesión
                </button>

                <!-- ✅ Botón cerrar sesión -->
                <button id="logout-btn" class="btn btn-danger d-none">Cerrar Sesión</button>

                <!-- ✅ Carrito -->
                <button class="btn btn-outline-primary position-relative" data-bs-toggle="modal" data-bs-target="#carritoModal">
                    Carrito
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- NAV LINKS -->
    <div class="container my-3">
        <div class="d-flex justify-content-center gap-4">
            <a href="indexgestionarpanes.html" class="btn btn-link">Panes</a>
            <a href="#" class="btn btn-link">Información</a>
            <a href="#" class="btn btn-link">Sobre la Empresa</a>
            <a href="#" class="btn btn-link">Atole</a>
        </div>
    </div>

    <!-- CATALOGO -->
    <div class="container">
        <h3 class="mb-3">Catálogo de Panes</h3>
        <div id="catalogo-panes" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Panes cargados desde apppanes.js -->
        </div>
    </div>

    <!-- ✅ MODAL LOGIN -->
    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Iniciar Sesión</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">

                <label class="form-label">Nombre</label>
                <input id="login-nombre" class="form-control" type="text">

                <label class="form-label mt-2">Contraseña</label>
                <input id="login-pass" class="form-control" type="password">

          </div>
          <div class="modal-footer">
            <button id="btn-logear" class="btn btn-primary">Entrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ MODAL CARRITO -->
    <div class="modal fade" id="carritoModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Carrito de Compras</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">

            <ul id="lista-carrito" class="list-group">
              <!-- Aquí van los panes agregados -->
            </ul>

          </div>
          <div class="modal-footer">
            <button class="btn btn-success">Finalizar Compra</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ✅ LOGICA DE SESION -->
    <script>
        function verificarSesion() {
            const usuario = localStorage.getItem("usuario");
            const userInfo = document.getElementById("user-info");
            const loginBtn = document.getElementById("login-btn");
            const logoutBtn = document.getElementById("logout-btn");

            if (usuario) {
                userInfo.textContent = "Bienvenido, " + usuario;
                loginBtn.classList.add("d-none");
                logoutBtn.classList.remove("d-none");
            } else {
                userInfo.textContent = "";
                loginBtn.classList.remove("d-none");
                logoutBtn.classList.add("d-none");
            }
        }

        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("usuario");
            verificarSesion();
        });

        document.getElementById("btn-logear").addEventListener("click", async () => {
            const nombre = document.getElementById("login-nombre").value;
            const pass = document.getElementById("login-pass").value;

            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre, contraseña: pass })
            });

            const data = await res.json();

            if (data.ok) {
                localStorage.setItem("usuario", nombre);
                verificarSesion();
                document.querySelector("#loginModal .btn-close").click();
                alert("Bienvenido!");
            } else {
                alert("Datos incorrectos");
            }
        });

        verificarSesion();
    </script>

    <script src="apppanes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
