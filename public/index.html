<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desesperanza - Panes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" href="#">Desesperanza</a>

            <div class="d-flex align-items-center gap-3">

                <!-- ✅ Mostrar nombre del usuario -->
                <div id="user-info" class="fw-semibold text-primary"></div>

                <!-- ✅ Botón login o logout -->
                <button id="login-btn" class="btn btn-outline-primary">Iniciar Sesión</button>
                <button id="logout-btn" class="btn btn-danger d-none">Cerrar Sesión</button>

                <button class="btn btn-outline-primary position-relative">
                    Carrito
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- NAV LINKS -->
    <div class="container my-3">
        <div class="d-flex justify-content-center gap-4">
            <a href="indexgestionarpanes.html" class="btn btn-link">Panes</a>
            <a href="#" class="btn btn-link">Información</a>
            <a href="#" class="btn btn-link">Sobre la Empresa</a>
            <a href="#" class="btn btn-link">Atole</a>
        </div>
    </div>

    <!-- CATALOGO DE PANES -->
    <div class="container">
        <h3 class="mb-3">Catálogo de Panes</h3>
        <div id="catalogo-panes" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Aquí se cargan los panes desde apppanes.js -->
        </div>
    </div>

    <script>
        // ✅ VERIFICA si hay usuario guardado en LocalStorage
        function verificarSesion() {
            const usuario = localStorage.getItem("usuario");
            const userInfo = document.getElementById("user-info");
            const loginBtn = document.getElementById("login-btn");
            const logoutBtn = document.getElementById("logout-btn");

            if (usuario) {
                userInfo.textContent = "Bienvenido, " + usuario;
                loginBtn.classList.add("d-none");
                logoutBtn.classList.remove("d-none");
            } else {
                userInfo.textContent = "";
                loginBtn.classList.remove("d-none");
                logoutBtn.classList.add("d-none");
            }
        }

        // ✅ Botón de iniciar sesión -> va al login
        document.getElementById("login-btn").addEventListener("click", () => {
            window.location.href = "indexlogin.html";
        });

        // ✅ Botón cerrar sesión
        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("usuario");
            verificarSesion();
        });

        verificarSesion();
    </script>

    <script src="apppanes.js"></script>
</body>
</html>
