<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Panes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h2 class="mb-4">Gestión de Panes</h2>

        <!-- FORMULARIO PARA AGREGAR/EDITAR PANES -->
        <form id="form-pan" class="mb-5" enctype="multipart/form-data">
            <input type="hidden" id="pan-id">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Pan</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>

            <div class="mb-3">
                <label for="costo" class="form-label">Costo</label>
                <input type="number" class="form-control" id="costo" required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="2" required></textarea>
            </div>

            <!-- ✅ NUEVO: campo cantidad -->
            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" required>
            </div>

            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="imagen" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Guardar Pan</button>
        </form>

        <!-- LISTA DE PANES -->
        <div id="lista-panes" class="row row-cols-1 row-cols-md-2 g-4">
            <!-- Aquí se cargan los panes desde apppanes.js -->
        </div>
    </div>

    <script src="apppanes.js"></script>
</body>
</html>
