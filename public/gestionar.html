<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestionar Panes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand h1">📦 Gestionar Panes</span>
    <a class="btn btn-warning" href="index.html">Volver al catálogo</a>
</nav>

<div class="container mt-4">

    <div class="card shadow p-4">
        <h3>Agregar nuevo pan</h3>
        <form id="formPan" enctype="multipart/form-data" class="row g-3">

            <div class="col-md-6">
                <input class="form-control" name="nombre" placeholder="Nombre" required>
            </div>

            <div class="col-md-6">
                <input class="form-control" name="precio" type="number" step="0.01" placeholder="Precio" required>
            </div>

            <div class="col-md-6">
                <input class="form-control" name="cantidad" type="number" placeholder="Cantidad" required>
            </div>

            <div class="col-md-6">
                <input class="form-control" type="file" name="imagen">
            </div>

            <div class="col-12">
                <textarea class="form-control" name="descripcion" placeholder="Descripción"></textarea>
            </div>

            <div class="col-12 text-center">
                <button class="btn btn-success">Guardar Pan</button>
            </div>
        </form>
    </div>

    <h3 class="mt-5">Lista de panes</h3>
    <table class="table table-striped table-hover mt-3 shadow">
        <thead class="table-dark">
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="listaPanes"></tbody>
    </table>

</div>

<script src="apppanes.js"></script>
</body>
</html>
